<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊能能 · 电子名片</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);padding:20px}
  .card{width:420px;max-width:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .card-header{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);padding:36px 32px 28px;text-align:center;position:relative}
  .card-header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:20px;background:#fff;border-radius:20px 20px 0 0}
  .avatar{width:80px;height:80px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:3px solid rgba(255,255,255,.3);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;font-weight:800}
  .name{font-size:1.8rem;font-weight:800;color:#fff;letter-spacing:4px;margin-bottom:8px}
  .title{font-size:.85rem;color:rgba(255,255,255,.75);letter-spacing:2px}
  .card-body{padding:28px 32px 32px;text-align:center}
  .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:24px}
  .tag{font-size:.72rem;padding:4px 12px;border-radius:20px;background:#f0f4f8;color:#2c5364;font-weight:500;letter-spacing:.5px}
  .divider{height:1px;background:linear-gradient(to right,transparent,#d0d7de,transparent);margin:20px 0}
  .info-list{text-align:left;margin-bottom:24px}
  .info-item{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:.88rem;color:#444}
  .info-item .icon{width:28px;height:28px;background:#f0f4f8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
  .info-item .label{color:#999;font-size:.75rem;margin-right:4px}
  .info-item .value{color:#1a1a2e;font-weight:500}
  .qr-section{background:#f8fafb;border-radius:12px;padding:20px;text-align:center}
  .qr-section .qr-img{width:140px;height:140px;margin:0 auto 12px;border-radius:8px;border:1px solid #e8ecf1}
  .qr-section .qr-hint{font-size:.75rem;color:#999;letter-spacing:1px}
  .slogan{margin-top:20px;font-size:.82rem;color:#2c5364;font-weight:600;letter-spacing:1px;line-height:1.6}
  .card-footer{padding:16px 32px 20px;text-align:center}
  .card-footer .company{font-size:.75rem;color:#bbb;letter-spacing:1px}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="avatar">能</div>
    <div class="name">熊能能</div>
    <div class="title">资深流量操盘手</div>
  </div>
  <div class="card-body">
    <div class="tags">
      <span class="tag">📊 电商运营专家</span>
      <span class="tag">🏥 大健康实战派</span>
      <span class="tag">📱 新媒体全域操盘</span>
      <span class="tag">🤖 AI赋能营销</span>
    </div>
    <div class="divider"></div>
    <div class="info-list">
      <div class="info-item">
        <div class="icon">🏢</div>
        <div><span class="label">公司</span><span class="value">西安妍谋企业咨询管理有限公司</span></div>
      </div>
      <div class="info-item">
        <div class="icon">💼</div>
        <div><span class="label">职位</span><span class="value">创始人 / 流量负责人</span></div>
      </div>
      <div class="info-item">
        <div class="icon">🔥</div>
        <div><span class="label">战绩</span><span class="value">驼奶粉3年5000万｜私域贡献超60%</span></div>
      </div>
      <div class="info-item">
        <div class="icon">⏳</div>
        <div><span class="label">经验</span><span class="value">15年电商+大健康+新媒体全域实战</span></div>
      </div>
    </div>
    <div class="qr-section">
      <img class="qr-img" src="qrcode.png" alt="二维码">
      <div class="qr-hint">扫码查看我的完整经历</div>
    </div>
    <div class="slogan">15年流量操盘手｜把流量变订单，把私域变复购</div>
  </div>
  <div class="card-footer">
    <div class="company">西安妍谋企业咨询管理有限公司</div>
  </div>
</div>

</body>
</html>
